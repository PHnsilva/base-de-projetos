<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Wireframe da tela Solicitar reserva</title>
<desc id="descricao">Formulário à esquerda e exemplos de erro de campo e resposta incerta à direita.</desc>
<rect width="860" height="460" fill="#f5f6f8"/>
